  <section style="border-bottom:1px solid var(--color-divider)">
    <div style="max-width:1360px;margin:0 auto;padding:50px 40px 40px">
      <div style="display:flex;align-items:center;gap:10px;font-family:var(--font-mono);font-weight:700;font-size:11.5px;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted)">
        <span style="width:22px;height:2px;background:var(--color-accent);display:block"></span>Big stages
      </div>
      <h1 style="font-size:88px;line-height:0.88;margin:16px 0 0">Festivals <span style="background:linear-gradient(120deg,var(--gold-bright),var(--color-accent) 55%,var(--color-accent-2));-webkit-background-clip:text;background-clip:text;color:transparent">&amp; Shows</span></h1>
      <p style="font-size:18px;line-height:1.55;max-width:60ch;margin:18px 0 0;color:#d8d8de;text-wrap:pretty">The festivals Burna Boy has headlined — and the other big stages he's played. {{ total }} appearances across three categories.</p>
    </div>
  </section>

  <section style="border-bottom:1px solid var(--color-divider);background:var(--color-surface)">
    <div style="max-width:1360px;margin:0 auto;padding:0 40px;display:grid;grid-template-columns:repeat(3,1fr)">
      <sc-for list="{{ counts }}" as="c" hint-placeholder-count="3">
        <a href="{{ c.href }}" style="padding:26px 24px 24px;border-left:1px solid var(--color-divider);display:block;color:var(--color-text)" style-hover="background:var(--color-accent-100)">
          <div style="font-family:var(--font-heading);font-size:48px;line-height:0.9;color:var(--text);font-variant-numeric:tabular-nums">{{ c.value }}</div>
          <div style="font-family:var(--font-mono);font-weight:700;font-size:11.5px;letter-spacing:0.14em;text-transform:uppercase;margin-top:12px">{{ c.label }}</div>
        </a>
      </sc-for>
    </div>
  </section>

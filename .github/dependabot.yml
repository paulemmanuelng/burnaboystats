# Dependency updates — deliberately quiet.
#
# The first version of this file was written on 9 Sep 2026 and was wrong in a
# way that only showed up after it merged: within two minutes it opened SEVEN
# pull requests. It asked for weekly npm updates with a `development` group
# restricted to minor and patch, which does not mean "skip majors" — it means
# majors fall OUT of the group and each gets its own PR. So vitest 4->5,
# jsdom 29->30 and jest-dom 6->7 arrived as three separate PRs, plus two more
# for actions/checkout and actions/setup-node going 4->7, on top of the two
# grouped ones. None of the seven was a security fix.
#
# The fix is grouping, NOT ignoring. An earlier attempt at this file added an
# `ignore` rule for every semver-major, which would have been worse than the
# problem: ignore rules can suppress Dependabot SECURITY pull requests too, and
# a vulnerability whose fix happens to be a major bump is exactly the one you
# cannot afford to silence. So nothing is ignored here. Every update type is IN
# a group instead, which is what actually collapses the PR count.
#
# Monthly, and at most two npm PRs plus one actions PR — a month of bumps
# arrives as a handful of PRs rather than one per package.
#
# Worth being explicit, because it is the part that misled me the first time:
# this file only drives SCHEDULED VERSION UPDATES. Vulnerability PRs come from
# the repo's "Dependabot security updates" toggle, which is a repo setting and
# is still switched off. Deleting this file entirely would cost no security
# coverage at all — it would only stop the routine version churn.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      # Both groups take every update type on purpose. A group that omits one
      # does not skip those updates; it just un-groups them.
      production:
        dependency-type: production
        update-types: ["major", "minor", "patch"]
      development:
        dependency-type: development
        update-types: ["major", "minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]

# Dependency updates — deliberately quiet.
#
# The first version of this file was written on 9 Sep 2026 and was wrong in a
# way that only showed up after it merged: within two minutes it opened SEVEN
# pull requests. It asked for weekly npm updates with a `development` group
# restricted to minor and patch, which does not mean "skip majors" — it means
# majors fall OUT of the group and each gets its own PR. So vitest 4->5,
# jsdom 29->30 and jest-dom 6->7 arrived as three separate PRs, plus two more
# for actions/checkout and actions/setup-node going 4->7, on top of the two
# grouped ones. None of the seven was a security fix.
#
# What the owner actually needs from Dependabot is to hear about
# VULNERABILITIES, not about routine version churn. Those come from the repo's
# "Dependabot security updates" toggle, NOT from this file — this file only
# drives scheduled version updates. So this is now set as low as it goes while
# still existing:
#
#   * monthly, not weekly
#   * ONE group per ecosystem covering every update type, so a month's worth of
#     bumps is a single PR rather than one per package
#   * major versions ignored outright for devDependencies — a major bump to a
#     test runner needs a human deciding to do it, not a PR arriving unbidden
#
# Worst case is now one npm PR and one actions PR a month. If even that is too
# much, delete this file: security updates keep working without it.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      production:
        dependency-type: production
        update-types: ["major", "minor", "patch"]
      development:
        dependency-type: development
        update-types: ["minor", "patch"]
    ignore:
      # Majors on test/lint tooling: breaking by definition, and a PR that
      # arrives on its own is the wrong way to find out.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]

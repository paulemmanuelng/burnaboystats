# Build gate. Until this existed the only automation was the stats bots, so a
# commit that broke the types, the tests or the build would deploy to
# burnaboystats.com and be discovered by a visitor rather than by CI.
#
# Runs the same sequence as `npm run verify` locally, including the post-build
# SEO check — that one needs the rendered HTML, since most titles and
# descriptions are built from live data and their length isn't knowable from
# the source.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

# A newer push makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Types
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: SEO gate
        run: node scripts/check-seo.mjs

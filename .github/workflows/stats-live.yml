name: Stats live

# Fully-automatic refresh for the "live" figures (Spotify followers + peak
# monthly listeners) and the live chart boards, on FOUR FIXED SLOTS a day. It
# fetches the sources, runs each value through the sanity gate in
# scripts/apply-stat-updates.mjs, and commits any sane change STRAIGHT TO main
# (no PR) — so the site stays current with no human action. Vercel redeploys on
# the push. Implausible values are rejected, never committed.
#
# Why four slots and not every half hour (Paul, 23 Sep 2026): every push is a
# production deploy, and every deploy starts the CDN and ISR cache for all ~800
# pages cold. The bot was 19 of the 68 deploys in the week to 23 Sep, so the
# first visitor to most pages in most regions paid the cold path (~0.35 s from
# London). The site only ever promised figures "several times a day"
# (app/lib/liveChartMeta.ts), and GitHub fired the half-hourly schedule every 2-6
# hours anyway. workflow_dispatch is still "publish now".
#
# Followers needs SPOTIFY_CLIENT_ID / SPOTIFY_CLIENT_SECRET repo secrets; without
# them that one metric is skipped (its value just holds), everything else runs.

on:
  schedule:
    # 00:17, 06:17, 12:17 and 18:17 UTC (01:17, 07:17, 13:17, 19:17 in Lagos).
    # The hours are multiples of six on purpose: they are the hours the YouTube
    # sweep keys on — though every run now sweeps regardless (see SWEEP_* below),
    # because GitHub often starts a scheduled run late, into the next hour.
    - cron: "17 0,6,12,18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: stats-live
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Needed for the verification step below. Cached, so it costs seconds.
      - run: npm ci

      - name: Refresh live figures (sanity-gated)
        id: live
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: node scripts/apply-stat-updates.mjs --live

      # Regenerates app/data/liveCharts.ts wholesale — a dataset, not a single
      # figure, so it can't go through the anchored find/replace path above.
      # It refuses to write a suspiciously small result, so a reshaped source
      # page fails loudly instead of blanking the page.
      # EVERY run sweeps the country charts. The gates in build-live-charts.mjs
      # (first firing of the hour; YouTube only on hours divisible by six) were
      # written for a half-hourly schedule, to keep ~204 requests a pass from
      # running 48 times a day. At four slots a day there is nothing to
      # throttle, and the gates would now do harm: a 06:17 run that GitHub starts
      # at 07:05 would skip YouTube, and nothing would say so. Pinning the clock
      # to 00:00 tells both gates "sweep". Manual runs sweep too, as before.
      - name: Rebuild live platform charts
        env:
          SWEEP_MINUTE: "0"
          SWEEP_HOUR: "0"
        run: node scripts/build-live-charts.mjs

      # The Afrobeats Board's live boards, same pipeline and same sanity gate.
      # `continue-on-error`: a board artist's source page going missing must
      # never block Burna Boy's own refresh, which is what this job exists for.
      # The build refuses to write a suspiciously small result, so a failure
      # here leaves the last good snapshot in place rather than blanking a page.
      - name: Rebuild the board's live charts
        id: board
        continue-on-error: true
        env:
          SWEEP_MINUTE: "0"
          SWEEP_HOUR: "0"
        run: node scripts/build-live-charts.mjs --artist=board

      # Gate on the working tree, not on one step's output: either generator
      # can be the only thing that changed, and keying off just the first would
      # silently drop the other's work.
      # The bot's commits used to carry [skip ci], so CI never saw them — roughly
      # 24 pushes a day, and the only writes to the fastest-moving figures on the
      # site, went out with nothing checking them. Verifying HERE rather than
      # un-skipping CI is the stronger order: a bad regeneration is caught before
      # it is published, not reported once it is already live.
      #
      # Types and tests only. The build and the SEO gate take minutes and cover
      # page structure, which a data refresh cannot change; the 300-odd tests are
      # what actually validate the shape and internal consistency of this data.
      - name: Verify the regenerated data
        # PUBLISH_GATE marks this as the publishing path, which skips the four
        # DEADLINE ALARMS (tests/awardsPending.test.ts, tests/liveClaims.test.ts,
        # tests/staleness.test.ts and the reading-age alarm in
        # tests/listeners.test.ts).
        # Those are designed to go red on a date with nothing in the repo having
        # changed — an award ceremony being held, a chart reading going stale.
        # They are notifications for a human, and they still fail in ci.yml on
        # every push and PR. Here they would instead stop the step below from
        # running at all, so the refresh would quietly stop publishing and
        # look like a broken bot. Every other test still runs:
        # this skips four alarms, not the verification.
        env:
          PUBLISH_GATE: "1"
        run: |
          set -euo pipefail
          npx tsc --noEmit
          npm run test

      - name: Commit to main
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing changed"; exit 0
          fi
          git config user.name "burnaboystats-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "chore(stats): live refresh of tracked figures [skip ci]"
          git push origin HEAD:main

      # The board rebuild is allowed to fail without blocking his refresh — that
      # is what continue-on-error buys, and it is the right trade. What it must
      # not buy is silence: without this every board live page can freeze on a
      # stale snapshot behind a green tick, indefinitely. Runs last so the commit
      # above still publishes.
      - name: Surface a failed board rebuild
        if: steps.board.outcome == 'failure'
        run: |
          echo "::error::The board's live charts failed to rebuild. His own figures were published; the board's live pages are serving the previous snapshot until this is fixed."
          exit 1

      # An offset that no longer matches its source (the career Spotify total:
      # kworb raw + a measured ChartMasters offset). After a fall in the raw the
      # figure is safe — it only ever moves up, so it holds at its last value —
      # but it is now known to be off by the amount in the log, and only a human can
      # re-measure it (scripts/chartmasters-anchor.mjs, on Paul's ChartMasters
      # sign-in). Until 25 Sep 2026 this case stopped the whole job: the run
      # recorded the new raw reading without publishing it, the offsetDrift
      # reconcile test failed on that working copy, and not one figure
      # published for as long as it lasted. It now fails here, AFTER the commit:
      # everything else goes out, and the run stays red while the raw sum sits
      # below the held reading. It clears by itself once the raw sum climbs back
      # past it, and the total then publishes on the OLD offset; so a drift alarm
      # means "re-measure the offset against ChartMasters", whether or not it
      # has since gone green.
      # !cancelled() so a failed board rebuild above does not hide this one.
      - name: Surface an offset that no longer matches its source
        if: ${{ !cancelled() && steps.live.outputs.has_drift == 'true' }}
        run: |
          echo "::error::An offset no longer matches its source; the 'Refresh live figures' log says which, by how much, and in which direction. Every other figure was published. Re-measure the offset on ChartMasters with scripts/chartmasters-anchor.mjs."
          exit 1

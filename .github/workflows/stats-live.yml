name: Stats live

# Fully-automatic half-hourly refresh for the "live" figures (Spotify followers +
# peak monthly listeners). It fetches the sources, runs each value through the
# sanity gate in scripts/apply-stat-updates.mjs, and commits any sane change
# STRAIGHT TO main (no PR) — so the site stays current with no human action.
# Vercel redeploys on the push. Implausible values are rejected, never committed.
#
# Followers needs SPOTIFY_CLIENT_ID / SPOTIFY_CLIENT_SECRET repo secrets; without
# them that one metric is skipped (its value just holds), everything else runs.

on:
  schedule:
    - cron: "17,47 * * * *" # every 30 minutes, at :17 and :47 past
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: stats-live
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Needed for the verification step below. Cached, so it costs seconds.
      - run: npm ci

      - name: Refresh live figures (sanity-gated)
        id: live
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: node scripts/apply-stat-updates.mjs --live

      # Regenerates app/data/liveCharts.ts wholesale — a dataset, not a single
      # figure, so it can't go through the anchored find/replace path above.
      # It refuses to write a suspiciously small result, so a reshaped source
      # page fails loudly instead of blanking the page.
      # A MANUAL run always sweeps. The country sweeps are gated to the first
      # firing of each hour so the twice-hourly schedule cannot double their
      # ~204 requests a pass — but that gate also caught workflow_dispatch,
      # which exists precisely to force a refresh NOW. Dispatching at, say,
      # 09:30 silently carried the last sweep forward instead, so a manual
      # "sync now" did nothing for half of every hour. Pinning the minute to 0
      # on dispatch only tells the gate this is a first firing; the schedule is
      # untouched and still sweeps once an hour.
      - name: Rebuild live platform charts
        env:
          SWEEP_MINUTE: ${{ github.event_name == 'workflow_dispatch' && '0' || '' }}
        run: node scripts/build-live-charts.mjs

      # The Afrobeats Board's live boards, same pipeline and same sanity gate.
      # `continue-on-error`: a board artist's source page going missing must
      # never block Burna Boy's own refresh, which is what this job exists for.
      # The build refuses to write a suspiciously small result, so a failure
      # here leaves the last good snapshot in place rather than blanking a page.
      - name: Rebuild the board's live charts
        id: board
        continue-on-error: true
        env:
          SWEEP_MINUTE: ${{ github.event_name == 'workflow_dispatch' && '0' || '' }}
        run: node scripts/build-live-charts.mjs --artist=board

      # Gate on the working tree, not on one step's output: either generator
      # can be the only thing that changed, and keying off just the first would
      # silently drop the other's work.
      # The bot's commits used to carry [skip ci], so CI never saw them — roughly
      # 24 pushes a day, and the only writes to the fastest-moving figures on the
      # site, went out with nothing checking them. Verifying HERE rather than
      # un-skipping CI is the stronger order: a bad regeneration is caught before
      # it is published, not reported once it is already live.
      #
      # Types and tests only. The build and the SEO gate take minutes and cover
      # page structure, which a data refresh cannot change; the 300-odd tests are
      # what actually validate the shape and internal consistency of this data.
      - name: Verify the regenerated data
        run: |
          set -euo pipefail
          npx tsc --noEmit
          npm run test

      - name: Commit to main
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing changed"; exit 0
          fi
          git config user.name "burnaboystats-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "chore(stats): live refresh of tracked figures [skip ci]"
          git push origin HEAD:main

      # The board rebuild is allowed to fail without blocking his refresh — that
      # is what continue-on-error buys, and it is the right trade. What it must
      # not buy is silence: without this the nine board pages can freeze on a
      # stale snapshot behind a green tick, indefinitely. Runs last so the commit
      # above still publishes.
      - name: Surface a failed board rebuild
        if: steps.board.outcome == 'failure'
        run: |
          echo "::error::The board's live charts failed to rebuild. His own figures were published; the nine board live pages are serving the previous snapshot until this is fixed."
          exit 1

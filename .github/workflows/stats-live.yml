name: Stats live

# Fully-automatic hourly refresh for the "live" figures (Spotify followers +
# peak monthly listeners). It fetches the sources, runs each value through the
# sanity gate in scripts/apply-stat-updates.mjs, and commits any sane change
# STRAIGHT TO main (no PR) — so the site stays current with no human action.
# Vercel redeploys on the push. Implausible values are rejected, never committed.
#
# Followers needs SPOTIFY_CLIENT_ID / SPOTIFY_CLIENT_SECRET repo secrets; without
# them that one metric is skipped (its value just holds), everything else runs.

on:
  schedule:
    - cron: "17 * * * *" # hourly, at :17 past
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: stats-live
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh live figures (sanity-gated)
        id: live
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: node scripts/apply-stat-updates.mjs --live

      # Regenerates app/data/liveCharts.ts wholesale — a dataset, not a single
      # figure, so it can't go through the anchored find/replace path above.
      # It refuses to write a suspiciously small result, so a reshaped source
      # page fails loudly instead of blanking the page.
      - name: Rebuild live platform charts
        run: node scripts/build-live-charts.mjs

      # The Afrobeats Board's live boards, same pipeline and same sanity gate.
      # `continue-on-error`: a board artist's source page going missing must
      # never block Burna Boy's own refresh, which is what this job exists for.
      # The build refuses to write a suspiciously small result, so a failure
      # here leaves the last good snapshot in place rather than blanking a page.
      - name: Rebuild the board's live charts
        continue-on-error: true
        run: node scripts/build-live-charts.mjs --artist=wizkid

      # Gate on the working tree, not on one step's output: either generator
      # can be the only thing that changed, and keying off just the first would
      # silently drop the other's work.
      - name: Commit to main
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing changed"; exit 0
          fi
          git config user.name "burnaboystats-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "chore(stats): live refresh of tracked figures [skip ci]"
          git push origin HEAD:main
